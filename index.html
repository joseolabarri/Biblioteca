<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EE; --surface:#FFFFFF; --surface2:#FBFAF6;
  --ink:#23211C; --ink2:#5B564D; --ink3:#8E887C;
  --line:#E7E3D9; --line2:#D9D4C8;
  --accent:#2C3E66; --accent-d:#22314f; --accent-soft:#EAEEF6; --accent-line:#C7D2E6;
  --shadow:0 1px 2px rgba(40,36,28,.04),0 6px 20px rgba(40,36,28,.06);
  --shadow-lg:0 8px 40px rgba(40,36,28,.14);
  --serif:"Newsreader",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  --r:12px; --r-sm:8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}
.serif{font-family:var(--serif)}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,244,238,.86);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px}
.brand{display:flex;flex-direction:column;line-height:1.1;flex:none}
.brand .t{font-family:var(--serif);font-size:22px;font-weight:600}
.brand .s{font-size:11.5px;color:var(--ink3);letter-spacing:.02em}
.nav{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:none;color:var(--ink2);padding:8px 13px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap;transition:.15s}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button.on{background:var(--accent);color:#fff}
.auth{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;background:#B9B3A6}
.dot.live{background:#3E9E5B;box-shadow:0 0 0 3px rgba(62,158,91,.15)}
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.danger{color:#B4442E;border-color:#e7c7bf}
.btn.danger:hover{background:#fbeeeb}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 90px}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{margin-bottom:22px}
.head h2{font-family:var(--serif);font-size:clamp(24px,3vw,32px);font-weight:600}
.head p{color:var(--ink2);margin:4px 0 0;font-size:14.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.stat .k{font-size:11.5px;color:var(--ink3);margin-top:7px;text-transform:uppercase;letter-spacing:.06em}
.stat .v .u{font-size:15px;color:var(--ink3);font-family:var(--sans)}

/* ---------- resumen grid ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.panel-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600;margin-bottom:16px}
.bar-row{display:grid;grid-template-columns:76px 1fr 42px;align-items:center;gap:12px;margin-bottom:10px}
.bar-row .lbl{font-size:13px;color:var(--ink2);text-align:right}
.bar-track{height:20px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#8ea0c8,var(--accent));border-radius:5px 0 0 5px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar-row .val{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.dist{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.dist .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.dist .cb{width:100%;border-radius:5px 5px 0 0;min-height:2px;height:0;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.dist .cn{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.dist .cl{font-size:14px;font-weight:600;color:var(--ink2)}
.rank{display:flex;flex-direction:column;gap:2px}
.rank a,.rank .ri{display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:8px;text-decoration:none;color:var(--ink);transition:.12s;cursor:pointer}
.rank a:hover,.rank .ri:hover{background:var(--surface2)}
.rank .n{font-size:12px;color:var(--ink3);width:16px;font-variant-numeric:tabular-nums}
.rank .nm{flex:1;font-size:14px}
.rank .mt{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.gems{display:flex;flex-wrap:wrap;gap:8px}
.gem{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:6px 12px 6px 8px;font-size:13px}
.gem b{font-family:var(--serif);font-weight:500}

/* ---------- lollipop (nota media por siglo) ---------- */
.lolli{margin-top:2px}
.lolli-row{display:grid;grid-template-columns:50px 1fr 34px;align-items:center;gap:12px;height:34px}
.lolli-track{position:relative;height:100%}
.lolli-base{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%);border-radius:2px}
.lolli-ref{position:absolute;top:3px;bottom:3px;border-left:1px dashed var(--line2)}
.lolli-stem{position:absolute;top:50%;height:4px;transform:translateY(-50%);border-radius:3px;opacity:.3;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.lolli-dot{position:absolute;top:50%;transform:translate(-50%,-50%) scale(0);border-radius:50%;box-shadow:0 1px 3px rgba(40,36,28,.22);border:2px solid #fff;transition:transform .55s cubic-bezier(.2,.9,.3,1.2)}
.lolli-lbl{font-size:13px;color:var(--ink2);text-align:right}
.lolli-val{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.lolli-axis{display:grid;grid-template-columns:50px 1fr 34px;gap:12px;margin-top:4px}
.lolli-ticks{position:relative;height:15px;font-size:10.5px;color:var(--ink3)}
.lolli-ticks span{position:absolute;transform:translateX(-50%)}
.lolli-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.lolli-legend .ref{display:inline-block;height:13px;border-left:1px dashed var(--line2)}

/* ---------- rating chip ---------- */
.rt{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 7px;border-radius:7px;font-weight:700;font-size:13px;color:#fff;font-variant-numeric:tabular-nums}
.rt.lg{min-width:52px;height:52px;font-size:22px;border-radius:12px;font-family:var(--serif)}

/* ---------- toolbar / filters ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:10px 13px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;border:none;outline:none;background:none;color:var(--ink)}
.search svg{opacity:.4;flex:none}
select.f{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--ink);cursor:pointer;max-width:180px}
select.f:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.notachips{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:4px}
.notachips button{border:none;background:none;color:var(--ink2);padding:6px 10px;border-radius:7px;font-size:13px;font-weight:600}
.notachips button.on{background:var(--accent);color:#fff}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:4px}
.seg button{border:none;background:none;padding:7px 10px;border-radius:7px;color:var(--ink2);display:inline-flex;align-items:center}
.seg button.on{background:var(--accent);color:#fff}
.count{font-size:13px;color:var(--ink3);margin:2px 2px 14px}

/* ---------- book list / grid ---------- */
.blist{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.brow{display:grid;grid-template-columns:1fr 190px 84px 150px 46px;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.blist .brow:last-child{border-bottom:none}
.brow:hover{background:var(--surface2)}
.brow .bt{font-family:var(--serif);font-size:16.5px;line-height:1.25}
.brow .ba{color:var(--ink2);font-size:13.5px}
.brow .bmeta{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:130px}
.bcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.bcard .bt{font-family:var(--serif);font-size:18px;line-height:1.2}
.bcard .ba{color:var(--ink2);font-size:13.5px}
.bcard .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.tag{display:inline-block;font-size:12px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.empty{text-align:center;padding:60px 20px;color:var(--ink3)}

/* ---------- entity tables (autores / paises) ---------- */
.etable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.etable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.etable th:hover{color:var(--accent)}
.etable th .ar{opacity:.35}
.etable th.sd .ar{opacity:1;color:var(--accent)}
.etable td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.etable tr:last-child td{border-bottom:none}
.etable tbody tr{cursor:pointer;transition:.12s}
.etable tbody tr:hover{background:var(--surface2)}
.etable .nm{font-family:var(--serif);font-size:16px}
.etable .num{font-variant-numeric:tabular-nums}
.avgpill{display:inline-flex;align-items:center;gap:7px}
.avgpill .swatch{width:10px;height:10px;border-radius:3px}
.th-right,.td-right{text-align:right}

/* ---------- comparador ---------- */
.cmp-pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.chips-sel{display:flex;flex-wrap:wrap;gap:8px}
.chip-sel{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-d);border-radius:99px;padding:6px 8px 6px 13px;font-size:13.5px;font-weight:500}
.chip-sel button{border:none;background:none;color:var(--accent-d);font-size:15px;line-height:1;padding:0 2px;opacity:.7}
.chip-sel button:hover{opacity:1}
.cmp-cols{display:grid;gap:16px}
.cmp-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.cmp-col h3{font-family:var(--serif);font-size:21px;margin-bottom:2px}
.cmp-col .sub{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.cmp-metric{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.cmp-metric .m{font-size:13px;color:var(--ink2)}
.cmp-metric .v{font-weight:600;font-variant-numeric:tabular-nums}
.cmp-metric .v.best{color:var(--accent)}
.cmp-dist{display:flex;align-items:flex-end;gap:5px;height:56px;margin:12px 0 4px}
.cmp-dist .b{flex:1;border-radius:3px 3px 0 0;min-height:2px;background:var(--line2)}
.cmp-books{margin-top:12px;max-height:210px;overflow:auto}
.cmp-books .li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px dashed var(--line)}
.cmp-books .li .tt{font-family:var(--serif)}

/* ---------- forms / gestionar ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--ink2);font-weight:500}
.field input,.field select{background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:16px}
.hint{font-size:12.5px;color:var(--ink3)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-d);border-radius:10px;padding:12px 14px;font-size:13.5px}
.notice.warn{background:#FBF3E7;border-color:#EAD6AE;color:#7a5a1c}

/* ---------- modal ---------- */
/* ---------- gate (acceso privado) ---------- */
.gate-wrap{min-height:62vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:34px 30px;width:100%;max-width:384px}
.gate-card .gate-title{font-family:var(--serif);font-size:30px;font-weight:600;margin-bottom:4px}
.gate-card .gate-p{color:var(--ink2);margin:0 0 22px;font-size:14px}
.gate-card .field{margin-bottom:14px}
.gate-card .btn.primary{width:100%;justify-content:center;text-align:center;padding:12px;margin-top:6px}
.gate-err{color:#B4442E;font-size:13px;margin-top:12px;min-height:16px;text-align:center}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(35,33,28,.42);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:fade .2s}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);max-width:460px;width:100%;padding:24px;position:relative}
.modal.wide{max-width:560px}
.modal .x{position:absolute;top:14px;right:14px;border:none;background:none;font-size:22px;color:var(--ink3);line-height:1}
.modal h3{font-family:var(--serif);font-size:24px;padding-right:24px}
.modal .mrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.modal dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0 0;font-size:14px}
.modal dt{color:var(--ink3)}
.modal dd{margin:0}

/* ---------- responsive ---------- */
@media(max-width:920px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
  .brow{grid-template-columns:1fr 70px 44px}
  .brow .ba-col,.brow .bpais{display:none}
}
@media(max-width:620px){
  .topbar-in{flex-wrap:wrap;gap:10px;padding:12px 16px}
  .auth{order:2;margin-left:0}
  .nav{order:3;width:100%;margin-left:0}
  .wrap{padding:20px 16px 90px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:25px}
  .brow{grid-template-columns:1fr 44px}
  .brow .bmeta.byear{display:none}
  .etable .hide-sm{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main class="wrap"><div id="app"></div></main>

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function toRoman(n){const v=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';for(const[a,s]of v){while(n>=a){r+=s;n-=a;}}return r;}
function siglo(anio){const bc=anio<0,y=Math.abs(anio),c=Math.floor(y/100)+1;return {num:bc?-c:c,label:'s. '+toRoman(c)+(bc?' a.C.':'')};}
function fmtYear(a){return a<0?Math.abs(a)+' a.C.':''+a;}
function fmtAvg(x){return x.toFixed(1).replace('.',',');}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const RC=[[5,'#C05C43'],[6,'#CF8A3C'],[7,'#C6A63E'],[8,'#8AA24C'],[9,'#4E9A5C'],[10,'#2F8551']];
function ratingColor(n){n=Math.round(n);if(n<=5)return RC[0][1];if(n>=10)return RC[5][1];return RC[n-5][1];}
function avgColor(x){ // continuous 5..10
  const stops=RC.map(r=>r[1]); const t=Math.max(0,Math.min(1,(x-5)/5))*5; const i=Math.min(4,Math.floor(t)); const f=t-i;
  const h=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const a=h(stops[i]),b=h(stops[i+1]||stops[i]);
  return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(',')})`;
}

   ============================================================ */
let store;
function makeStore(){
  const useCloud = firebaseConfig.apiKey && firebaseConfig.projectId;
  if(useCloud){
    firebase.initializeApp(firebaseConfig);
    const db=firebase.firestore(), auth=firebase.auth();
    let listeners=[], authCbs=[];
    return {
      mode:'cloud', admin:false, user:null,
      onAuth(cb){authCbs.push(cb);},
      init(cb){
        let unsub=null;
        auth.onAuthStateChanged(u=>{
          this.user=u;this.admin=!!u;authCbs.forEach(f=>f());
          if(u){
            if(!unsub)unsub=db.collection('libros').orderBy('titulo').onSnapshot(snap=>{
              cb(snap.docs.map(d=>({id:d.id,...d.data()})));
            },err=>{console.error(err);cb([]);});
          }else{
            if(unsub){unsub();unsub=null;}
            cb([]);
          }
        });
      },
      async login(email,pass){await auth.signInWithEmailAndPassword(email,pass);},
      async logout(){await auth.signOut();},
      async add(b){await db.collection('libros').add(b);},
      async update(id,b){await db.collection('libros').doc(id).set(b,{merge:true});},
      async remove(id){await db.collection('libros').doc(id).delete();},
      async seedAll(list){const batch=db.batch();list.forEach(b=>{const ref=db.collection('libros').doc();batch.set(ref,b);});await batch.commit();}
    };
  }
  // ---- local ----
  const KEY='biblioteca_libros_v1';
  let books=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!books){books=SEED.map((b,i)=>({id:'loc_'+i,...b}));localStorage.setItem(KEY,JSON.stringify(books));}
  let cb=()=>{};
  const persist=()=>{localStorage.setItem(KEY,JSON.stringify(books));cb(books.slice());};
  const nid=()=>'loc_'+Date.now()+'_'+Math.floor(Math.random()*1e4);
  return {
    mode:'local', admin:true, user:null,
    onAuth(){}, init(fn){cb=fn;cb(books.slice());},
    async login(){}, async logout(){},
    async add(b){books.push({id:nid(),...b});persist();},
    async update(id,b){const i=books.findIndex(x=>x.id===id);if(i>=0){books[i]={id,...b};persist();}},
    async remove(id){books=books.filter(x=>x.id!==id);persist();},
    async seedAll(list){books=list.map(b=>({id:nid(),...b}));persist();}
  };
}

let BOOKS=[];
const S={view:'resumen', bib:{q:'',pais:'',autor:'',siglo:'',notaMin:0,sort:'anio_desc',layout:'list'},
         aut:{q:'',sort:'n_desc'}, pai:{q:'',sort:'n_desc'},
         cmp:{tipo:'autores',sel:[]}, ges:{q:'',editId:null}};

function groupBy(keyFn){
  const m={};
  BOOKS.forEach(b=>{const k=keyFn(b);(m[k]=m[k]||{key:k,books:[]}).books.push(b);});
  return Object.values(m).map(o=>{
    const notas=o.books.map(b=>b.nota);
    o.n=o.books.length; o.avg=notas.reduce((a,c)=>a+c,0)/o.n;
    o.min=Math.min(...o.books.map(b=>b.anio)); o.max=Math.max(...o.books.map(b=>b.anio));
    o.best=o.books.slice().sort((a,b)=>b.nota-a.nota)[0];
    return o;
  });
}
function stats(){
  const n=BOOKS.length, notas=BOOKS.map(b=>b.nota);
  const avg=n?notas.reduce((a,c)=>a+c,0)/n:0;
  const autores=new Set(BOOKS.map(b=>b.autor)).size;
  const paises=new Set(BOOKS.map(b=>b.pais)).size;
  const anios=BOOKS.map(b=>b.anio);
  return {n,avg,autores,paises,min:Math.min(...anios),max:Math.max(...anios),dieces:BOOKS.filter(b=>b.nota===10)};
}

function filteredBib(){
  const q=S.bib.q.trim().toLowerCase();
  let r=BOOKS.filter(b=>{
    if(S.bib.pais&&b.pais!==S.bib.pais)return false;
    if(S.bib.autor&&b.autor!==S.bib.autor)return false;
    if(S.bib.siglo&&siglo(b.anio).label!==S.bib.siglo)return false;
    if(S.bib.notaMin&&b.nota<S.bib.notaMin)return false;
    if(q&&!(b.titulo.toLowerCase().includes(q)||b.autor.toLowerCase().includes(q)||b.pais.toLowerCase().includes(q)))return false;
    return true;
  });
  const[k,dir]=S.bib.sort.split('_');const s=dir==='asc'?1:-1;
  r.sort((a,b)=>{let x=a[k],y=b[k];if(typeof x==='string')return x.localeCompare(y,'es')*s;return (x-y)*s;});
  return r;
}
function refreshBib(){
  const rows=filteredBib();const h=$('#bib-holder');const cnt=$('.count');
  cnt.textContent=`${rows.length} de ${BOOKS.length} libros`;
  h.innerHTML='';
  if(!rows.length){h.appendChild(el('div','empty','No hay libros que coincidan con estos filtros.'));return;}
  if(S.bib.layout==='list'){
    const list=el('div','blist');
    rows.forEach(b=>{const r=el('div','brow');
      r.innerHTML=`<div><div class="bt">${esc(b.titulo)}</div><div class="ba">${esc(b.autor)}</div></div>
        <div class="bmeta ba-col">${esc(b.pais)}</div>
        <div class="bmeta byear">${fmtYear(b.anio)}</div>
        <div class="bmeta bpais">${esc(siglo(b.anio).label)}</div>
        <div class="rt" style="background:${ratingColor(b.nota)}">${b.nota}</div>`;
      r.onclick=()=>openBook(b);list.appendChild(r);});
    h.appendChild(list);
  }else{
    const g=el('div','bgrid');
    rows.forEach(b=>{const c=el('div','bcard');
      c.innerHTML=`<div class="bt">${esc(b.titulo)}</div><div class="ba">${esc(b.autor)}</div>
        <div class="foot"><span class="tag">${fmtYear(b.anio)} · ${esc(b.pais)}</span><span class="rt" style="background:${ratingColor(b.nota)}">${b.nota}</span></div>`;
      c.onclick=()=>openBook(b);g.appendChild(c);});
    h.appendChild(g);
  }
}

    return {name,books:bs,n:bs.length,avg:notas.reduce((a,c)=>a+c,0)/bs.length,min:Math.min(...bs.map(b=>b.anio)),max:Math.max(...bs.map(b=>b.anio)),best:bs.slice().sort((a,b)=>b.nota-a.nota)[0]};});

      <div class="cmp-metric"><span class="m">Rango de años</span><span class="v">${fmtYear(g.min)}${g.min!==g.max?'–'+fmtYear(g.max):''}</span></div>
      <div class="cmp-metric"><span class="m">Mejor valorado</span><span class="v" style="font-weight:500">${esc(g.best.titulo)} (${g.best.nota})</span></div>
      <div style="margin-top:14px" class="panel-title">Distribución de notas</div>${dist}${books}`;

function openEntity(kind,name){

function confirmDelete(b){
  const m=modal(`<h3>Borrar libro</h3><p class="muted" style="margin:10px 0 0">¿Seguro que quieres eliminar <b>${esc(b.titulo)}</b>? Esta acción no se puede deshacer.</p>
    <div class="mrow" style="margin-top:20px;justify-content:flex-end"><button class="btn" data-c>Cancelar</button><button class="btn danger" data-x>Sí, borrar</button></div>`);
  m.el.querySelector('[data-c]').onclick=m.close;
  m.el.querySelector('[data-x]').onclick=async()=>{try{await store.remove(b.id);m.close();if(store.mode==='local')render();toast('Libro borrado.');}catch(e){toast('Error: '+e.message);}};
}
function openLogin(){
  const m=modal(`<h3>Entrar</h3><p class="muted" style="font-size:13px;margin:6px 0 14px">Con tu cuenta de administrador puedes añadir y editar libros.</p>
    <div class="field" style="margin-bottom:10px"><label>Email</label><input id="l-email" type="email" placeholder="tu@email"></div>
    <div class="field"><label>Contraseña</label><input id="l-pass" type="password"></div>
    <div class="mrow" style="margin-top:18px;justify-content:flex-end"><button class="btn primary" data-go>Entrar</button></div>
    <div id="l-err" style="color:#B4442E;font-size:13px;margin-top:10px"></div>`);
  const go=async()=>{try{await store.login($('#l-email').value.trim(),$('#l-pass').value);m.close();}catch(e){$('#l-err').textContent='No se pudo entrar. Revisa el email y la contraseña.';}};
  m.el.querySelector('[data-go]').onclick=go;
  m.el.querySelector('#l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}
let toastT;
function toast(msg){let t=$('#toast');if(!t){t=el('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#23211C;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:.2s';document.body.appendChild(t);}
  t.textContent=msg;requestAnimationFrame(()=>t.style.opacity='1');clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity='0',2200);}

function exportJSON(){const data=BOOKS.map(({id,...b})=>b);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=el('a');a.href=URL.createObjectURL(blob);a.download='mi-biblioteca.json';a.click();}
function importJSON(){const inp=el('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;const clean=arr.filter(b=>b.titulo&&b.autor).map(b=>({titulo:b.titulo,autor:b.autor,pais:b.pais||'',anio:parseInt(b.anio,10)||0,nota:parseInt(b.nota,10)||0,siglo:siglo(parseInt(b.anio,10)||0).label}));
  const m=modal(`<h3>Importar ${clean.length} libros</h3><p class="muted" style="margin:10px 0 0">¿Añadir estos libros a tu biblioteca actual?</p><div class="mrow" style="margin-top:18px;justify-content:flex-end"><button class="btn" data-c>Cancelar</button><button class="btn primary" data-ok>Importar</button></div>`);
  m.el.querySelector('[data-c]').onclick=m.close;
  m.el.querySelector('[data-ok]').onclick=async()=>{for(const b of clean){await store.add(b);}m.close();if(store.mode==='local')render();toast('Importados '+clean.length+' libros.');};
  }catch(e){toast('Archivo no válido.');}};inp.click();}

/* ---------- small builders ---------- */
function searchBox(val,ph,on){const w=el('label','search');w.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>';const i=el('input');i.type='search';i.placeholder=ph;i.value=val;i.addEventListener('input',()=>on(i.value));w.appendChild(i);return w;}
function selectFilter(opts,val,allLabel,on){return selectRaw([['',allLabel],...opts.map(o=>[o,o])],val,on,'f');}
function selectRaw(pairs,val,on,cls){const s=el('select',(cls||'')+' f');pairs.forEach(([v,l])=>{const o=el('option',null,esc(l));o.value=v;if(v===val)o.selected=true;s.appendChild(o);});s.onchange=()=>on(s.value);return s;}
function uniqueSorted(arr){return [...new Set(arr)].sort((a,b)=>a.localeCompare(b,'es'));}
function parseSiglo(label){const m=label.match(/s\. ([MDCLXVI]+)( a\.C\.)?/);if(!m)return 0;const val=fromRoman(m[1]);return m[2]?-val:val;}
function fromRoman(s){const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};let n=0;for(let i=0;i<s.length;i++){const c=map[s[i]],nx=map[s[i+1]];n+= (nx&&c<nx)?-c:c;}return n;}
function swap(node){const a=app();a.innerHTML='';a.appendChild(node);}

store=makeStore();
store.onAuth(()=>{render();});
store.init(books=>{BOOKS=books;render();});
render();
